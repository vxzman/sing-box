name: FreeBSD

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
          - { goos: freebsd, goarch: arm, goarm: "7" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
          # The vxzman/sing-tun pseudo-version may not have go.sum entries
          # yet; resolve them at build time. The fork is outside the sum
          # database.
          GOFLAGS: -mod=mod
          GONOSUMDB: github.com/vxzman
          # Tag pushes embed the tag as the version (e.g. v1.14f); manual
          # dispatches fall back to dev.
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: |
          go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ env.VERSION }}' -s -w -buildid=" -tags "with_gvisor,with_quic,with_utls,with_acme,with_clash_api" -o sing-box ./cmd/sing-box
          if [ "${{ matrix.goarch }}" == "arm" ]; then
            ARCHIVE="sing-box-${{ env.VERSION }}-freebsd-${{ matrix.goarch }}v${{ matrix.goarm }}.tar.gz"
          else
            ARCHIVE="sing-box-${{ env.VERSION }}-freebsd-${{ matrix.goarch }}.tar.gz"
          fi
          tar -czf "${ARCHIVE}" sing-box
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: sing-box-*.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: false
          files: ${{ env.ARCHIVE }}
